name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mlp
          POSTGRES_PASSWORD: mlp
          POSTGRES_DB: mlp_test
        ports: ["5437:5432"]
        options: >-
          --health-cmd "pg_isready -U mlp -d mlp_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check app tests scripts migrations
          ruff format --check app tests scripts migrations
      - name: Type check
        run: mypy app scripts
      - name: Tests (real PostgreSQL and MLflow registry; S3 via moto)
        run: pytest --cov=app --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  lifecycle:
    name: Lifecycle gate (a year of drift through the real pipeline)
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mlp
          POSTGRES_PASSWORD: mlp
          POSTGRES_DB: mlp_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlp -d mlp_eval" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MLP_DATABASE_URL: postgresql+psycopg://mlp:mlp@localhost:5432/mlp_eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Fails if a drift scenario goes undetected for more than a month, if stable months raise
      # alarms, or if the managed model is not clearly better than one that is never retrained.
      - run: python scripts/lifecycle_offline.py --out /tmp/lifecycle --gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-report
          path: /tmp/lifecycle

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mlp-backend backend
      - run: docker build -t mlp-web frontend
      # The image must honour SageMaker's `serve` entrypoint and answer /ping (503 = up, no model yet).
      - name: SageMaker container contract smoke test
        run: |
          docker run -d --name serving -p 8080:8080 -e MLP_MLFLOW_TRACKING_URI=http://127.0.0.1:9 mlp-backend serve
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/ping || true)
            [ "$code" = "503" ] && echo "serving up, waiting for a model as expected" && exit 0
            sleep 2
          done
          docker logs serving; exit 1

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks CLI over the full history (gitleaks-action scans "<first commit>^..HEAD", which
      # fails on a repository's first push because the root commit has no parent).
      - name: Scan full git history
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
